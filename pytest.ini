[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    -s
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --tracing=retain-on-failure
    --screenshot=only-on-failure
markers =
    api: HTTP-level API tests (no browser)
    ui: browser tests with Playwright
    e2e: hybrid UI + API tests
    smoke: tiny, fast checks
