name: CI

on:
  push:
    branches: [main]
  pull_request:
  # schedule:
  # - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser for the UI job"
        type: choice
        options: [all, chromium, firefox, webkit]
        default: all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

  # Everything that does not need a browser. Exit code 5 = "no tests collected yet", allowed.
  api:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install playwright dependencies
        run: playwright install
      - run: pytest -m "api" -n auto
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: api-reports
          path: reports/
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: api-allure-results
          path: allure-results/
          if-no-files-found: warn

  ui:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event.inputs.browser && github.event.inputs.browser != 'all' && format('["{0}"]', github.event.inputs.browser) || '["chromium","firefox","webkit"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - run: playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser tests (mark them with @pytest.mark.ui)
        run: >
          pytest -m ui --browser ${{ matrix.browser }} --video retain-on-failure -n 2
          --html=reports/ui-${{ matrix.browser }}.html
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-reports-${{ matrix.browser }}
          path: |
            reports/
            test-results/
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: warn

  build-allure-report:
    if: always()
    needs: [api, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: "*-allure-results*"
          path: allure-results
          merge-multiple: true
      - name: Install Allure CLI
        run: npm install -g allure-commandline
      - name: Generate Allure report
        run: allure generate allure-results --clean --output allure-report
      - uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-report/
